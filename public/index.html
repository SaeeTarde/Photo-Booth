<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Booth for Two</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/landing.css" />
</head>
<body>
  <main class="card">
    <h1>PHOTO BOOTH</h1>
    <p class="sub">Step in from anywhere. Pull the curtain. Get a strip. Or watch your favorite shows together. Get loving moment together.
      <span class="heart">♥</span> </p>
    <input id="your-name" class="name-input" maxlength="16" placeholder="YOUR NAME" autocomplete="off" />
    <button id="create" class="btn primary">Start a booth</button>

    <div class="or"><span>or</span></div>

    <form id="join-form">
      <input id="code" maxlength="4" placeholder="ROOM CODE" autocomplete="off" />
      <button class="btn" type="submit">Join</button>
    </form>
    <div class="or"><span>or</span></div>

    <a href="/solo" class="btn solo-link">📸 Solo booth</a>

    <div class="or"><span>or</span></div>

    <button id="watch-create" class="btn watch-btn">🍿 Watch together</button>

    <form id="watch-form">
      <input id="watch-code" maxlength="4" placeholder="WATCH CODE" autocomplete="off" />
      <button class="btn" type="submit">Join</button>
    </form>

    <div class="or"></div>

    <div class="visitor-counter">
    <span>📸</span>
    <span>visited by</span>
    <span id="visitor-count">...</span>
    <span>people</span>
    </div>

    <footer class="credit-footer">

  <p class="made-by">
    Made with <span class="heart">♥</span> by
    <span class="creator-name">Saee Tarde</span>
  </p>

  <div class="social-links">

    <a
      href="https://www.linkedin.com/in/saee-tarde-b98185435/"
      target="_blank"
      rel="noopener noreferrer"
      class="credit"
    >
      LinkedIn
    </a>

    <span class="separator">·</span>

    <a
      href="https://www.instagram.com/lllavender_iykyk/"
      target="_blank"
      rel="noopener noreferrer"
      class="credit"
    >
      Instagram
    </a>


  </div>

  <div class="mail">saeetarde@gmail.com
  </div>
  <div class="feedback-link"> Have a review or suggestion? DM or mail 💌</div>
</footer>
  </main>

  

  <script src="js/landing.js"></script>
</body>
</html>
