<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Booth for Two</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/landing.css" />
</head>
<body>
  <main class="card">
    <p class="kicker">★ Photos · 4 frames · 2 people ★</p>
    <h1>PHOTO BOOTH</h1>
    <p class="sub">Step in from anywhere. Pull the curtain. Get a strip.</p>

    <button id="create" class="btn primary">Start a booth</button>

    <div class="or"><span>or</span></div>

    <form id="join-form">
      <input id="code" maxlength="4" placeholder="ROOM CODE" autocomplete="off" />
      <button class="btn" type="submit">Join</button>
    </form>
    <div class="or"><span>or</span></div>

    <a href="/solo" class="btn solo-link">📸 Solo booth</a>

    <div class="or"><span>or</span></div>

    <button id="watch-create" class="btn watch-btn">🍿 Watch together</button>

    <form id="watch-form">
      <input id="watch-code" maxlength="4" placeholder="WATCH CODE" autocomplete="off" />
      <button class="btn" type="submit">Join</button>
    </form>

    <footer class="credit-footer">
  <a
    href="https://www.instagram.com/lllavender_iykyk/"
    target="_blank"
    rel="noopener noreferrer"
    class="credit"
  >Made by Saee_Tarde <span class="heart">♥</span></a>
    </footer>
  </main>

  

  <script src="js/landing.js"></script>
</body>
</html>
